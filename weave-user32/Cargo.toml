[package]
name = "weave-user32"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "user32.dll stubs for Weave — windowing, message loop, input"

[dependencies]
weave-common = { path = "../weave-common" }
weave-core = { path = "../weave-core" }
libc = "0.2"

# x11rb is a pure-Rust X11 protocol client — no C FFI, no libxcb required.
# fontdue is a pure-Rust font parser + rasterizer for TrueType/OpenType.
# Both gated to Linux-only so macOS test-unit builds don't pull them in.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
fontdue = "0.9"
