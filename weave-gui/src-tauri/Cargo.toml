[package]
name = "weave-gui"
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/eldo9000/Weave"

[lib]
name = "weave_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
weave-installer = { path = "../../weave-installer" }
weave-desktop = { path = "../../weave-desktop" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"

[profile.dev]
incremental = true