[build]
# Weave is Linux x86-64 only. All builds are local on this PC using cargo-zigbuild.
# Build: cargo zigbuild --target x86_64-unknown-linux-gnu
# Tests run in Docker (`make test`).
target = "x86_64-unknown-linux-gnu"

[alias]
# Build for the Linux target
zbuild = "zigbuild --target x86_64-unknown-linux-gnu"
ztest  = "zigbuild --tests --target x86_64-unknown-linux-gnu"
